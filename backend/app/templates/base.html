<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 화면 대응 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>gptictionary</title>

    <link rel="icon" href="/static/favicon.png">

    <!-- CSS 캐시 무효화 -->
    <link rel="stylesheet" href="/static/css/style.css?v=42">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-top">
        <a href="/search" class="logo-text">gptictionary</a>

            ☰
        </button>
    </div>

    <a href="/">🏠 <span>대시보드</span></a>

    <div class="sidebar-bottom">
        <a href="/logout">🚪 <span>로그아웃</span></a>
    </div>
</div>

<main class="content">
    {% block content %}{% endblock %}
</main>

<script src="/static/js/sidebar.js?v=2"></script>
<script src="/static/tts.js?v=3"></script>

</html>
