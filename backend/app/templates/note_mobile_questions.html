{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/css/note-document.css?v=8">
<main class="nd-page">
  <a class="nd-back" href="/notes">← 영어 노트</a>
  <header class="nd-header"><h1>아이폰 질문함</h1></header>
  {% for entry in questions %}
  <article class="nd-section">
    <p style="white-space:pre-wrap;overflow-wrap:anywhere">{{ entry.question }}</p>
  </article>
  {% else %}
  <p>아직 저장된 질문이 없어요.</p>
  {% endfor %}
  {% if next_before %}
  <a class="nd-back" href="/notes/mobile-questions?before={{ next_before }}">이전 질문 보기</a>
  {% endif %}
</main>
{% endblock %}
